name: Weekly Match Data Scraper

on:
  schedule:
    # Runs every Tuesday at 22:00 UTC (10 PM UTC, adjust timezone as needed)
    - cron: '0 22 * * 2'
  
  # Allow manual trigger
  workflow_dispatch:

jobs:
  scrape-matches:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas openpyxl requests
      
      - name: Update match schedule
        run: |
          cd "$GITHUB_WORKSPACE"
          python scripts/update_schedule.py
        env:
          PYTHONUNBUFFERED: 1
      
      - name: Run automated scraper
        run: |
          cd "$GITHUB_WORKSPACE"
          python scripts/auto_weekly_scraper.py
        env:
          PYTHONUNBUFFERED: 1
      
      - name: Check for changes
        id: check_changes
        run: |
          git diff --quiet Data/Turkish\ Super\ League/ || echo "changes=true" >> $GITHUB_OUTPUT
      
      - name: Commit and push if changes
        if: steps.check_changes.outputs.changes == 'true'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add Data/schedule/season_schedule.json
          git add Data/Turkish\ Super\ League/**/*.xlsx
          git add Data/Turkish\ Super\ League/**/*.csv
          git commit -m "🤖 Auto-update: Weekly match data scrape (Round ${{ github.run_number }})"
          git push
